spring:
  datasource:
    url: jdbc:mysql://localhost:3306/FitCh?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: 여기에_본인_MySQL_계정
    password: 여기에_본인_MySQL_비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
jwt:
  secret: 여기에_32자_이상의_임의_문자열_입력
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000
ai:
  mock: true
  server:
    url: http://localhost:8001
server:
  port: 8080
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 여기에_카카오_REST_API_키
            client-secret: 여기에_카카오_Client_Secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: "https://kauth.kakao.com/oauth/authorize"
            token-uri: "https://kauth.kakao.com/oauth/token"
            user-info-uri: "https://kapi.kakao.com/v2/user/me"
            user-name-attribute: id
app:
  oauth:
    redirect-uri: "http://localhost:3000/oauth/success"